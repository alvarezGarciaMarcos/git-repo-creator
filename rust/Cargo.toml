[package]
name = "git-repo-creator"
version = "2.0.0"
edition = "2021"
description = "A tool for creating remote git repositories right from your command line"
license = "MIT"
repository = "https://github.com/alvarezGarciaMarcos/git-repo-creator"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
dialoguer = { version = "0.11", default-features = false, features = ["password"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["json", "native-certs"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "s"
